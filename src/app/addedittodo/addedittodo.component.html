 <div class="container mt-4">
      <h2>{{isEditMode ? 'Edit-Todo' : 'Add Todo'}}</h2>
      <form  (ngSubmit)="saveTodo()">
        <div class="form-group">
          <label for="title">title</label>
          <input type="text"
            class="form-control"
            [(ngModel)]="todo.title"
            (input)="onFormChange()"
            name="title"
            required="">
        </div>
        <div class="form-group">
          <label >
            <input type="checkbox"
            name="completed"
            (change)="onFormChange()"
            [(ngModel)]="todo.completed">
            completed
          </label>
        </div>
        <button type="submit" class="btn btn-success">{{isEditMode ? 'Update Todo' :'Add Todo'}}</button>
      </form>
 </div>
