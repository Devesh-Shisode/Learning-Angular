<!-- app.component.html -->
<div style="max-width: 400px; margin: 20px auto;">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit(userForm)">
    <label>Name:</label>
    <input formControlName="name" class="form-control" /><br />

    <label>Email:</label>
    <input formControlName="email" class="form-control" /><br />

    <label>Age:</label>
    <input formControlName="age" type="number" class="form-control" /><br />

    <button type="submit" class="btn sm btn-primary">Submit</button>
  </form>

</div>
