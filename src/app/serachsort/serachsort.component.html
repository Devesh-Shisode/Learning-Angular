<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-12">
      <input
        type="text"
        #searchbox
        class="form-control"
        (input)="onSearch(searchbox.value)"
        placeholder="Search by title"
      />
    </div>
  </div>

  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th (click)="sortPosts('id')" class="sortable">ID</th>
          <th>Title</th>
          <th>Body</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let post of paginatedPosts">
           
          <td>{{ post.id }}</td>
          <td>{{ post.title }}</td>
          <td>{{ post.body }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <button
      class="btn btn-outline-primary"
      (click)="currentPage = currentPage - 1"
      [disabled]="currentPage === 1"
    >
      Prev
    </button>

    <span class="fw-bold">Page {{ currentPage }} of {{ totalPages() }}</span>

    <button
      class="btn btn-outline-primary"
      (click)="currentPage = currentPage + 1"
      [disabled]="currentPage === totalPages()"
    >
      Next
    </button>
    
  </div>
  <div>
      <button (click)="getRandomValue()">GetRandomNumber</button>
      <h2>{{number}}</h2>
  </div>
</div>
