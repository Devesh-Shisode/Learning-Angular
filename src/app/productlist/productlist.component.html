<p>productlist works!</p>

<div>
  <h2>Productlist using ngFor</h2>
    <ul>
      <li *ngFor="let product of products let i=index" (click)="selectProduct(product)" >
        <h4>{{i+1}}.{{product.name}}</h4>
        <p>Price : ${{product.price}}</p>
        <p>Description : {{product.description}}</p>
        <p [ngStyle]="getRatingStyles(product.rating)">using ngStyle {{product.rating}} Stars</p>
      </li>
    </ul>
  <app-productdetails [product]="selectedProducts"></app-productdetails>
    
</div>
