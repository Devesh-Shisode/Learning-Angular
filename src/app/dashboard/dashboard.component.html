<div class="container"> 
  <div class="row">

    <div class="col-md-6">
      <h3>Services + SubjectBehaviour</h3>
      <div class="col-12">
        <input type="text" style="font-weight: bolder;" [placeholder]="counter$ | async" class="form-control">
      </div><br>
      <div class="d-inline-block p-2 d-flex gap-2">
        <button class="btn btn-primary" (click)="increment()">Increment</button> 
        <button class="btn btn-danger" (click)="decrement()">Decrement</button> 
        <button class="btn btn-success" (click)="reset()">Reset</button>
      </div>
    </div>

    <div class="col-md-6">
      <h3>Using NgRx</h3>
      <div class="col-12">
        <input type="text" style="font-weight: bolder;" [placeholder]="counter$$ | async" class="form-control">
      </div><br>
      <div class="d-inline-block p-2 d-flex gap-2">
        <button class="btn btn-primary" (click)="increment1()">Increment</button> 
        <button class="btn btn-danger" (click)="decrement2()">Decrement</button> 
        <button class="btn btn-success" (click)="reset3()">Reset</button>
      </div>
    </div>
  </div>
</div>
