 <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 text-left rounded shadow py-5">
        <h2 >Registration Form (TDF)</h2>
        <form #registrationForm="ngForm" (ngSubmit)="onsubmit(registrationForm)">
          <div class="form-group">
          <label for="name">Name</label>
          <input type="text"
                 id="name"
                 name="name"
                 placeholder="Enter Your Name"
                [(ngModel)]="user.name"
                 class="form-control"
                 required
                 #name="ngModel"
          ><div *ngIf="name.touched && name.invalid"  class="text-danger"> 
            User Name is Required.
          </div>
        </div>
          <div class="form-group">
          <label for="email">Email</label>
          <input type="text"
                 id="email"
                 name="email"
                [(ngModel)]="user.email"
                placeholder="Enter Your Email"
                 class="form-control"
                 #email="ngModel"
                 required
                 email
          > <div *ngIf="email.touched && email.invalid"  class="text-danger"> 
           <div *ngIf="email.errors?.['required']"> User Email is Required.</div>
           <div *ngIf="email.errors?.['email']"> Please Enter a Valid email.</div>
          </div>
        </div>
          <div class="form-group">
          <label for="password">Password</label>
          <input type="password"
                 id="password"
                 name="password"
                [(ngModel)]="user.password"
                placeholder="Enter Your Password"
                 class="form-control"
                 #password="ngModel"
                 required
                 minlength="6"
          > <div *ngIf="password.touched && password.invalid"  class="text-danger"> 
           <div *ngIf="password.errors?.['required']"> User Password is Required.</div>
           <div *ngIf="password.errors?.['minlength']"> password must be 6 characters your current length is {{user.password.length || 0}} </div>
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <div class="form-check">
              <input type="radio" name="gender" id="male" class="form-check-input" value="male"
              [(ngModel)]="user.gender" #gender="ngModel" required="">
              <label for="male" class="form-check-label"></label>

               <div class="form-check">
              <input type="radio" name="gender" id="female" class="form-check-input" value="female"
              [(ngModel)]="user.gender" #gender="ngModel" required="">
              <label for="female" class="form-check-label"></label>
              

              
            </div>
            </div>
          </div>
        </div>
           <button type="submit"   class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
 </div>
